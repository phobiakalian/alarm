name: 🚨 Build Alarm APK v4

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04  # Update ke Ubuntu 24.04
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 💾 Cache Buildozer & Dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer
          ~/.gradle
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}-${{ hashFiles('main.py') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-
    
    - name: 🐍 Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: 📦 Install Dependencies
      run: |
        pip install --upgrade pip setuptools wheel
        pip install buildozer==1.5.0 kivy==2.3.0 plyer==2.1.0 cython
        sudo apt update -qq
        sudo apt install -y -qq \
          git zip unzip openjdk-17-jdk-headless \
          python3-pip autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev \
          libtinfo5 cmake libffi-dev libssl-dev \
          libjpeg-dev libpng-dev
    
    - name: 🔨 Build APK
      run: |
        buildozer init
        buildozer -v android debug
      env:
        ANDROID_SDK_ROOT: $ANDROID_HOME
        ANDROID_NDK_ROOT: $ANDROID_NDK_HOME
    
    - name: 📤 Upload APK Artifact (v4)
      uses: actions/upload-artifact@v4  # ✅ v4 FIX!
      with:
        name: AlarmKu-${{ github.run_number }}.apk
        path: |
          bin/*.apk
          bin/*.aab
        retention-days: 30
        compression-level: 6
    
    - name: 📊 Show APK Info
      if: always()
      run: |
        ls -la bin/
        du -sh bin/*.apk