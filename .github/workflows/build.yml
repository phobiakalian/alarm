name: Alarm APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: |
        pip install buildozer kivy plyer
        sudo apt update && sudo apt install -y git unzip openjdk-17-jdk-headless python3-pip libncurses6 libssl-dev
    - run: |
        rm -rf bin/ .buildozer/
        echo "[app]" > buildozer.spec
        echo "title = AlarmKu" > buildozer.spec
        echo "package.name = alarmku" >> buildozer.spec  
        echo "package.domain = org.phobiakalian.alarmku" >> buildozer.spec
        echo "requirements = python3,kivy,plyer" >> buildozer.spec
        echo "android.permissions = VIBRATE,WAKE_LOCK" >> buildozer.spec
        echo "android.api = 33" >> buildozer.spec
        echo "android.ndk = 25b" >> buildozer.spec
        echo "log_level = 2" >> buildozer.spec
        pip install buildozer
        buildozer android debug
    - uses: actions/upload-artifact@v4
      with:
        name: AlarmKu.apk
        path: bin/*.apk