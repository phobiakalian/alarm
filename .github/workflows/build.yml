name: 🚨 Alarm APK - ULTRA CLEAN

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Cache
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: ${{ runner.os }}-v7
    
    - name: Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Dependencies
      run: |
        pip install buildozer==1.5.0 kivy==2.3.0 plyer
        
        sudo apt update -qq
        sudo apt install -y -qq git zip unzip openjdk-17-jdk-headless \
          python3-pip autoconf libtool pkg-config libncurses6 libtinfo6 \
          cmake libffi-dev libssl-dev libjpeg-dev libpng-dev libgl1 libglu1-mesa \
          libx11-dev
    
    - name: PERFECT Spec Setup
      run: |
        rm -rf .buildozer bin/ buildozer.spec
        
        # Generate FRESH spec
        buildozer init
        
        # ✅ EDIT EXISTING [app] section - NO DUPLICATE!
        sed -i "s/^title = .*/title = AlarmKu/" buildozer.spec
        sed -i "s/^package.name = .*/package.name = alarmku/" buildozer.spec
        sed -i "s/^package.domain = .*/package.domain = org.phobiakalian.alarmku/" buildozer.spec
        sed -i "/^requirements =/c\requirements = python3,kivy,plyer" buildozer.spec
        sed -i "/^android.permissions =/c\android.permissions = INTERNET,VIBRATE,WAKE_LOCK" buildozer.spec
        sed -i "s/^android.api = .*/android.api = 33/" buildozer.spec
        sed -i "s/^android.ndk = .*/android.ndk = 25b/" buildozer.spec
        
        echo "log_level = 2" >> buildozer.spec
        echo "android.accept_sdk_license = True" >> buildozer.spec
        
        echo "=== FINAL SPEC ==="
        cat buildozer.spec
    
    - name: Build APK
      run: buildozer -v android debug
    
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: AlarmKu.apk
        path: bin/*.apk