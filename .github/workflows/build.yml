name: Alarm APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y git unzip openjdk-17-jdk-headless libncurses6 libssl-dev zlib1g-dev autoconf libtool pkg-config

    - name: Install Buildozer & compatible Cython
      run: |
        pip install buildozer "cython<3" pkgconfig setuptools

    # ✅ CRITICAL: Pre-accept licenses & install build-tools BEFORE buildozer runs
    - name: Setup Android SDK licenses & build-tools
      run: |
        # Use system Android SDK path (already installed on GitHub runner)
        export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
        export ANDROID_HOME=$ANDROID_SDK_ROOT
        
        # Accept all licenses programmatically
        yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
        
        # Install specific build-tools version that we pinned
        $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "platforms;android-33"
        
        # Also copy licenses to buildozer's expected location (backup)
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
        cp -r $ANDROID_SDK_ROOT/licenses/* ~/.buildozer/android/platform/android-sdk/licenses/ 2>/dev/null || true

    - name: Clean previous builds
      run: |
        rm -rf .buildozer/bin .buildozer/android/platform/build*

    - name: Build APK
      run: |
        test -f buildozer.spec || (echo "❌ buildozer.spec tidak ditemukan!" && exit 1)
        buildozer -v android debug

    - uses: actions/upload-artifact@v4
      with:
        name: AlarmKu-APK
        path: bin/*.apk