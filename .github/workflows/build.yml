name: 🚨 Alarm APK - PERFECT BUILD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4
    
    - name: 💾 Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer
          ~/.gradle
        key: ${{ runner.os }}-alarm-v5-${{ hashFiles('main.py') }}
    
    - name: 🐍 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: 📦 Dependencies
      run: |
        pip install --upgrade pip wheel cython
        pip install buildozer==1.5.0 kivy==2.3.0 plyer==2.1.0
        
        sudo apt update -qq
        sudo apt install -y -qq \
          git zip unzip openjdk-17-jdk-headless python3-pip autoconf libtool pkg-config \
          libncurses6 libtinfo6 cmake libffi-dev libssl-dev libjpeg-dev libpng-dev \
          libgl1 libglu1-mesa libgl1-mesa-dri libglx-mesa0 libx11-dev libxext-dev
    
    - name: 🧹 CLEAN & Setup Spec ONCE
      run: |
        rm -rf .buildozer bin/
        rm -f buildozer.spec
        buildozer init
        
        # ✅ MINIMAL CONFIG - ONE TIME!
        cat >> buildozer.spec << EOF
        
[app]
title = AlarmKu
package.name = alarmku
package.domain = org.phobiakalian.alarmku
requirements = python3,kivy,plyer

android.permissions = INTERNET,VIBRATE,WAKE_LOCK

android.api = 33
android.minapi = 21
android.ndk = 25b

[buildozer]
log_level = 2
android.accept_sdk_license = True
EOF
    
    - name: 🔨 Build APK
      env:
        USE_CCACHE: 1
      run: buildozer -v android debug
    
    - name: 📤 APK
      uses: actions/upload-artifact@v4
      with:
        name: AlarmKu-${{ github.run_number }}.apk
        path: bin/*.apk
        retention-days: 60