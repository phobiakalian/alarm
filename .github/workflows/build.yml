name: 🚨 Build Alarm APK - Ubuntu 24.04 FIXED

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4
    
    - name: 💾 Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer
          ~/.gradle
        key: ${{ runner.os }}-buildozer-v2-${{ hashFiles('buildozer.spec') }}
    
    - name: 🐍 Python Setup
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: 📦 Ubuntu 24.04 Dependencies FIXED
      run: |
        pip install --upgrade pip setuptools wheel
        pip install buildozer==1.5.0 kivy==2.3.0 plyer==2.1.0 cython
        
        sudo apt update -qq
        sudo apt install -y -qq \
          git zip unzip openjdk-17-jdk-headless \
          python3-pip autoconf libtool pkg-config \
          zlib1g-dev libncurses6 libtinfo6 \
          cmake libffi-dev libssl-dev \
          libjpeg-dev libpng-dev libgl1-mesa-dev libgles2-mesa-dev \
          x11proto-core-dev libx11-dev libx11-xcb-dev libxcb1-dev \
          libxcursor-dev libxdamage-dev libxext-dev libxfixes-dev \
          libxi-dev libxrender-dev libxrandr-dev libxtst-dev \
          libgl1-mesa-glx libglu1-mesa-dev
    
    - name: 🔨 Build APK
      run: |
        buildozer init
        buildozer -v android debug
    
    - name: 📤 Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AlarmKu-v2-${{ github.run_number }}.apk
        path: bin/*.apk
        retention-days: 30