name: Alarm APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: |
        pip install buildozer kivy plyer
        sudo apt update && sudo apt install -y git unzip openjdk-17-jdk-headless python3-pip libncurses6 libssl-dev
    - run: |
        rm -rf bin/ .buildozer/
        run: |
        cat > buildozer.spec << 'EOF'
        [app]
        title = AlarmKu
        package.name = alarmku
        package.domain = org.phobiakalian.alarmku
        requirements = python3,kivy,plyer
        android.permissions = VIBRATE,WAKE_LOCK
        android.api = 33
        android.ndk = 25b
        log_level = 2
        EOF
        pip install buildozer
        buildozer android debug
    - uses: actions/upload-artifact@v4
      with:
        name: AlarmKu.apk
        path: bin/*.apk