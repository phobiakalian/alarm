name: 🚨 Alarm APK - Ubuntu 24.04 FINAL FIX

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4
    
    - name: 💾 Cache Everything
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer
          ~/.gradle
          ~/.android
        key: ${{ runner.os }}-alarmku-v3-${{ hashFiles('**/*') }}
    
    - name: 🐍 Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: 📦 Ubuntu 24.04 MINIMAL Dependencies (FIXED)
      run: |
        pip install --upgrade pip setuptools wheel cython
        pip install buildozer==1.5.0 kivy==2.3.0 plyer==2.1.0
        
        sudo apt update -qq
        sudo apt install -y -qq \
          # Core
          git zip unzip openjdk-17-jdk-headless python3-pip autoconf libtool pkg-config \
          # NCurses
          libncurses6 libtinfo6 \
          # Crypto/Image
          cmake libffi-dev libssl-dev libjpeg-dev libpng-dev \
          # OpenGL (Ubuntu 24.04)
          libgl1 libglu1-mesa libgl1-mesa-dri libglx-mesa0 \
          # X11 minimal
          libx11-dev libxext-dev libxrandr-dev libxrender-dev libxi-dev libxfixes-dev
          
        # Verify installs
        dpkg -l | grep libgl || echo "GL libs OK"
    
    - name: 🔨 Build APK (Verbose)
      run: |
        buildozer init
        buildozer -v android debug
      env:
        USE_CCACHE=1
    
    - name: 📤 Upload APK v4
      uses: actions/upload-artifact@v4
      with:
        name: AlarmKu-FINAL-${{ github.run_number }}.apk
        path: |
          bin/*.apk
        retention-days: 60
    
    - name: 📋 Debug Info
      if: always()
      run: |
        echo "=== FILES ==="
        ls -la bin/
        echo "=== SIZE ==="
        du -sh bin/* 2>/dev/null || echo "No APK?"