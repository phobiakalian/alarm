name: Alarm APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04  # Lebih stabil untuk Android NDK
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y git unzip openjdk-17-jdk-headless libncurses6 libssl-dev zlib1g-dev autoconf libtool pkg-config

    - name: Install Buildozer & compatible Cython
      run: |
        # ✅ Critical: Cython < 3 untuk kompatibilitas dengan python-for-android
        pip install buildozer "cython<3" pkgconfig setuptools

    - name: Build APK
      run: |
        test -f buildozer.spec || (echo "❌ buildozer.spec tidak ditemukan!" && exit 1)
        buildozer android debug

    - uses: actions/upload-artifact@v4
      with:
        name: AlarmKu-APK
        path: bin/*.apk