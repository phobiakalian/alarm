name: 🚨 Alarm APK - SYNTAX PERFECT

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer
          ~/.gradle
        key: ${{ runner.os }}-v6
    
    - name: Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Dependencies
      run: |
        pip install buildozer==1.5.0 kivy==2.3.0 plyer==2.1.0 cython
        
        sudo apt update -qq
        sudo apt install -y -qq git zip unzip openjdk-17-jdk-headless \
          python3-pip autoconf libtool pkg-config libncurses6 libtinfo6 \
          cmake libffi-dev libssl-dev libjpeg-dev libpng-dev libgl1 libglu1-mesa \
          libx11-dev libxext-dev
    
    - name: Setup Spec
      run: |
        rm -rf .buildozer bin/ buildozer.spec
        buildozer init
        
        # Append minimal config
        echo "[app]" >> buildozer.spec
        echo "title = AlarmKu" >> buildozer.spec
        echo "package.name = alarmku" >> buildozer.spec
        echo "package.domain = org.phobiakalian.alarmku" >> buildozer.spec
        echo "requirements = python3,kivy,plyer" >> buildozer.spec
        echo "android.permissions = INTERNET,VIBRATE,WAKE_LOCK" >> buildozer.spec
        echo "android.api = 33" >> buildozer.spec
        echo "android.minapi = 21" >> buildozer.spec
        echo "android.ndk = 25b" >> buildozer.spec
        echo "[buildozer]" >> buildozer.spec
        echo "log_level = 2" >> buildozer.spec
        echo "android.accept_sdk_license = True" >> buildozer.spec
        
        cat buildozer.spec
    
    - name: Build APK
      env:
        USE_CCACHE: 1
      run: buildozer -v android debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AlarmKu.apk
        path: bin/*.apk
        retention-days: 30