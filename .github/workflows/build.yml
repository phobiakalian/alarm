name: Alarm APK Final
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: ${{ runner.os }}-final
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install
      run: |
        pip install buildozer==1.5.0 kivy==2.3.0 plyer cython
        sudo apt update -qq
        sudo apt install -y -qq git zip unzip openjdk-17-jdk-headless autoconf libtool pkg-config libncurses6 libtinfo6 cmake libffi-dev libssl-dev libjpeg-dev libpng-dev libgl1 libglu1-mesa libx11-dev
    - name: Create Spec
      run: |
        rm -rf .buildozer bin/ buildozer.spec
        cat > buildozer.spec << 'EOF'
[app]
title = AlarmKu
package.name = alarmku
package.domain = org.phobiakalian.alarmku
source.dir = .
source.include_exts = py,png,jpg,kv,atlas,json
version = 1.0
requirements = python3,kivy,plyer
android.permissions = INTERNET,VIBRATE,WAKE_LOCK
android.api = 33
android.minapi = 21
android.ndk = 25b
[buildozer]
log_level = 2
android.accept_sdk_license = True
EOF
        cat buildozer.spec
    - name: Build
      run: buildozer android debug
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: AlarmKu.apk
        path: bin/*.apk