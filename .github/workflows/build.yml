name: 🚨 Alarm APK - Ubuntu 24.04 FINAL

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4
    
    - name: 💾 Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer
          ~/.gradle
          ~/.android
        key: ${{ runner.os }}-alarmku-v4-${{ hashFiles('**/*') }}
    
    - name: 🐍 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: 📦 Ubuntu 24.04 Dependencies
      run: |
        pip install --upgrade pip setuptools wheel cython
        pip install buildozer==1.5.0 kivy==2.3.0 plyer==2.1.0
        
        sudo apt update -qq
        sudo apt install -y -qq \
          git zip unzip openjdk-17-jdk-headless python3-pip autoconf libtool pkg-config \
          libncurses6 libtinfo6 cmake libffi-dev libssl-dev libjpeg-dev libpng-dev \
          libgl1 libglu1-mesa libgl1-mesa-dri libglx-mesa0 \
          libx11-dev libxext-dev libxrandr-dev libxrender-dev libxi-dev libxfixes-dev

    - name: 🔄 Regenerate buildozer.spec
      run: |
        rm -f buildozer.spec
        buildozer init
        # Edit minimal spec
        echo "requirements = python3,kivy,plyer" >> buildozer.spec
        
    - name: 🔨 Build APK
      env:
        USE_CCACHE: 1  # ✅ FIXED: Di env block!
      run: |
        buildozer init
        buildozer -v android debug
    
    - name: 📤 Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AlarmKu-${{ github.run_number }}.apk
        path: bin/*.apk
        retention-days: 60
    
    - name: 📋 Debug
      if: always()
      run: |
        ls -la bin/ || echo "No bin folder"
        find . -name "*.apk" -type f || echo "No APK found"